<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#263746">
    <title>Universal de Partes y Soportes</title>
    <link rel="icon" href="img/icono.png" type="image/png">
    <link rel="shortcut icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/icono-180.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- Menú lateral: lo dibuja js/app.js a partir de los módulos del servidor -->
    <nav class="sidebar" id="sidebar" aria-label="Módulos"></nav>
    <div class="menu-fondo" id="menu-fondo"></div>

    <div class="main-content">
        <header class="top-navbar">
            <button class="btn-menu" id="btn-menu" type="button" aria-label="Abrir el menú"><i class="bi bi-list"></i></button>
            <h1 class="titulo-pagina" id="titulo">Resumen</h1>
            <span class="usuario-actual" id="usuario-actual"></span>
            <button class="btn btn-sm btn-salir" type="button" id="btn-clave"><i class="bi bi-key me-1"></i><span class="d-none d-sm-inline">Cambiar contraseña</span></button>
            <button class="btn btn-sm btn-salir" type="button" id="btn-salir"><i class="bi bi-box-arrow-right me-1"></i>Salir</button>
        </header>
        <main id="vista"><div class="text-secondary">Cargando...</div></main>
    </div>

    <!-- Ventana para crear y editar registros -->
    <div class="modal fade" id="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="modal-titulo"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="modal-cuerpo"></div>
                <div class="modal-footer">
                    <div id="modal-error" class="text-danger small me-auto" style="white-space:pre-line"></div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-guardar">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Ventana con el detalle de un registro -->
    <div class="modal fade" id="modal-detalle" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <button type="button" class="btn btn-sm btn-outline-light me-3 d-none" id="det-atras"><i class="bi bi-arrow-left"></i> Volver</button>
                    <h5 class="modal-title me-auto" id="det-titulo"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body bg-light" id="det-cuerpo"></div>
            </div>
        </div>
    </div>

    <!-- Cambiar contraseña -->
    <div class="modal fade" id="modal-clave" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" id="form-clave" autocomplete="off" novalidate>
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Cambiar contraseña</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="d-none" autocomplete="username" tabindex="-1" aria-hidden="true">
                    <label class="small text-secondary fw-bold mb-1" for="clave-actual">Contraseña actual</label>
                    <div class="mb-3"><input type="password" id="clave-actual" class="form-control" autocomplete="current-password" maxlength="128" required></div>
                    <label class="small text-secondary fw-bold mb-1" for="clave-nueva">Contraseña nueva</label>
                    <div class="mb-1"><input type="password" id="clave-nueva" class="form-control" autocomplete="new-password" maxlength="72" required></div>
                    <div class="small text-secondary mb-3">Mínimo 10 caracteres, con mayúsculas, minúsculas y números.</div>
                    <label class="small text-secondary fw-bold mb-1" for="clave-repite">Repite la contraseña nueva</label>
                    <div class="mb-2"><input type="password" id="clave-repite" class="form-control" autocomplete="new-password" maxlength="72" required></div>
                    <label class="small text-secondary fw-bold mb-1" for="clave-codigo">Código de verificación (llega a tu correo)</label>
                    <div class="input-group mb-2">
                        <input type="text" id="clave-codigo" class="form-control campo-codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
                        <button type="button" class="btn btn-secondary" id="btn-enviar-codigo">Enviar código</button>
                    </div>
                    <div id="clave-msg" class="small mt-2" role="alert" style="white-space:pre-line"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-clave-ok">Guardar contraseña</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Vista previa e impresión de la factura -->
    <div class="modal fade" id="modal-factura" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title me-auto">Vista previa de la factura</h5>
                    <button type="button" class="btn btn-primary btn-sm me-3" id="btn-imprimir"><i class="bi bi-printer me-1"></i>Imprimir</button>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body bg-light" id="fac-cuerpo"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/ver-clave.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
